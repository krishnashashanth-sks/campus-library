name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0 or 2.1.0, without or with leading v)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as pre-release (excluded from in-app stable auto-updates)"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create as a draft GitHub Release (review before publishing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve and validate release version
        id: meta
        shell: pwsh
        run: |
          $raw = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          $raw = $raw.Trim()
          if ($raw -match '^v?(\d+(?:\.\d+){1,3})$') {
            $version = $Matches[1]
            $tag = "v$version"
          } else {
            throw "Invalid release tag/version '$raw'. Must match v<major>.<minor>[.<patch>] (e.g. v2.0 or v2.1.0) so update_service.py can parse it."
          }

          $isPrerelease = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.prerelease }}"
          } else {
            "false"
          }
          $isDraft = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.draft }}"
          } else {
            "false"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "draft=$isDraft" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag (version: $version, prerelease: $isPrerelease, draft: $isDraft)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-services.txt

      - name: Install build and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q -x "(\.venv|build|dist)" .

      - name: Run release readiness tests
        run: python -m unittest discover -s tests -v

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y
          }

      - name: Build Windows executable, updater ZIP, and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Version "${{ steps.meta.outputs.version }}"

      - name: Prepare release body with SHA-256 checksums
        id: notes
        shell: pwsh
        run: |
          $sums = (Get-Content -LiteralPath "SHA256SUMS.txt" -Raw).Trim()
          $fence = '```'
          $lines = @(
            '### Installation (Windows)',
            '- **New installs & manual upgrades:** Download and run `LibraryInstaller.exe`.',
            '- **Existing packaged installations:** Open **Settings -> Application Updates -> Check for Updates** inside the app (uses `Library-Windows.zip`).',
            '',
            '### SHA-256 Checksums',
            "${fence}text",
            $sums,
            $fence
          )
          $body = $lines -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP "release_notes.md"
          [System.IO.File]::WriteAllText($notesFile, $body, [System.Text.UTF8Encoding]::new($false))
          "body_path=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Library Management System ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            OutputInstaller/LibraryInstaller.exe
            Library-Windows.zip
            SHA256SUMS.txt
